<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODOリスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full min-h-screen bg-gray-100">
  <section class="bg-white w-full max-w-3xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">TODOリスト</h1>
    
    <div class="flex gap-2 mb-6">
        <input id="todoInput" type="text" placeholder="タスクを入力..."
          class="flex-1 border border-gray-300 rounded px-3 py-2">
        <button id="addBtn"
          class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition">
          追加
        </button>
    </div>
    <h2 class="text-xl font-bold text-gray-800 mb-4">タスク一覧</h2>
    <ul id="todoList" class="space-y-2"></ul>
  </section>
</body>
<script>
const todoInput = document.querySelector('#todoInput');
const addBtn = document.querySelector('#addBtn');
const todoList = document.querySelector('#todoList');

addBtn.addEventListener("click", () => {
    const task = todoInput.value;
     if (task ===""){
        retern;
     }

     const item = document.createElement("li");
        item.className = "flex items-center justify-between bg-gray-50 rounded px-3 py-2";
    const span = document.createElement("span");
        span.textContent = task;
    const doneBtn = document.createElement("button");
        doneBtn.textContent = "完了";
        doneBtn.className = "text-lg text-gray-300 px-2 font-bold hover:text-green-500";
    
    doneBtn.addEventListener("click", () => {
          span.classList.toggle("line-through");
          span.classList.add("text-gray-500")
          doneBtn.classList.remove("text-gray-300")
          doneBtn.classList.toggle("bg-green-600");
          doneBtn.classList.toggle("text-white");
          doneBtn.classList.toggle("hover:text-green-500");
          
        });

    item.appendChild(span);
    item.appendChild(doneBtn);
    todoList.appendChild(item);
    
    
      });
</script>
</html>
